{{- $s3 := and (eq .Values.storage.type "s3") (not .Values.storage.s3.existingSecret) .Values.storage.s3.accessKeyId }}
{{- $db := and (not .Values.mongodb.enabled) (not .Values.database.existingSecret) .Values.database.uri }}
{{- if or $s3 $db }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pic2cookie.secretName" . }}
  labels: {{- include "pic2cookie.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $s3 }}
  access-key-id: {{ .Values.storage.s3.accessKeyId | quote }}
  secret-access-key: {{ .Values.storage.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if $db }}
  database-uri: {{ .Values.database.uri | quote }}
  {{- end }}
{{- end }}
