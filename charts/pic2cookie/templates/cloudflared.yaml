{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pic2cookie.fullname" . }}-cloudflared
  labels: {{- include "pic2cookie.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  selector:
    matchLabels: {{- include "pic2cookie.selector" . | nindent 6 }}
      app.kubernetes.io/component: cloudflared
  template:
    metadata:
      labels: {{- include "pic2cookie.selector" . | nindent 8 }}
        app.kubernetes.io/component: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: {{ .Values.cloudflared.image }}
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "cloudflared.existingSecret is required" .Values.cloudflared.existingSecret }}
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
          {{- with .Values.cloudflared.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
