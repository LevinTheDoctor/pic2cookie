apiVersion: v1
kind: Service
metadata:
  name: {{ include "pic2cookie.fullname" . }}
  labels: {{- include "pic2cookie.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "pic2cookie.selector" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
